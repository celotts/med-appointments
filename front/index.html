<!DOCTYPE html>
<!--
  `lang="es"` porque TODA la interfaz esta en espanol.

  Con `lang="en"` pasaba algo visible: el navegador (Chrome/Edge) ofrecia
  traducir la pagina al espanol y, al hacerlo, traducía mal las abreviaturas de
  los dias de la semana ("Vie" -> "Rivalizar"). La app no tenia ese texto
  mal; lo generaba la traduccion automatica.

  Ademas `lang` no es decorativo: los lectores de pantalla pronuncian usando el
  idioma declarado, e `Intl.DateTimeFormat` formatea las fechas con el.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agenda clinica para especialistas y asistentes." />
    <title>MedAppointments - Agenda clinica</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
