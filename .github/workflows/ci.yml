name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests integrales (BD real + Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: fc100711
          POSTGRES_DB: appointment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d appointment"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://root:fc100711@localhost:5432/appointment
      SECRET_KEY: ci-secret-key-no-real
      FIRST_SUPERUSER_EMAIL: admin@medapi.com
      FIRST_SUPERUSER_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      # Lanzar Ollama (servicio separado) con los modelos necesarios
      - name: Iniciar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull nomic-embed-text
          ollama pull llama3.2

      # Esperar a que la BD esté lista
      - name: Esperar base de datos
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=fc100711 pg_isready -h localhost -p 5432 -U root -d appointment && break
            sleep 2
          done

      # Crear esquema inicial
      - name: Crear esquema de la BD
        run: PGPASSWORD=fc100711 psql -h localhost -U root -d appointment -f script_BD/init.sql

      # Aplicar migraciones (baseline + seeds)
      - name: Aplicar migraciones Alembic
        working-directory: backend
        run: python -m alembic upgrade head

      # Ejecutar la suite completa
      - name: Ejecutar tests
        working-directory: backend
        run: python -m pytest -v
