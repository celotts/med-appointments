name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Etapa 1: verificación estática, sin Docker ni base de datos.
  # Detecta documentación desfasada, vocabulario divergente de estados o
  # roles, migraciones con múltiples heads y secretos versionados.
  verify-docs:
    name: Documentación vs código
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar documentación
        run: make verify-docs

      - name: Comprobar que docs/API.md está regenerado
        run: |
          # Si el archivo generado cambia tras regenerarlo, alguien editó
          # docs/API.md a mano o agregó una ruta sin documentar.
          python scripts/gen_api_docs.py
          git diff --exit-code docs/API.md

  # Etapa 2: pruebas de integración contra PostgreSQL real y Ollama.
  test:
    name: Pruebas integrales (BD real + Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: fc100711
          POSTGRES_DB: appointment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d appointment"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://root:fc100711@localhost:5432/appointment
      SECRET_KEY: ci-secret-key-no-real
      FIRST_SUPERUSER_EMAIL: admin@medapi.com
      FIRST_SUPERUSER_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Ollama corre como servicio separado con los modelos del proyecto.
      - name: Instalar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl start ollama || (ollama serve &)
          sleep 10
          ollama pull nomic-embed-text
          ollama pull llama3.2

      - name: Crear el esquema de la BD
        run: PGPASSWORD=fc100711 psql -h localhost -U root -d appointment -f script_BD/init.sql

      - name: Aplicar migraciones Alembic
        working-directory: backend
        run: |
          python -m alembic upgrade head
          # Debe haber un solo head; si no, `upgrade head` fallaría.
          test "$(python -m alembic heads | wc -l)" -eq 1

      # Los estados canónicos deben existir tras las migraciones. Este es el
      # fallo que ocurría en producción: /wait, /start y /attend dependían
      # de EN ESPERA, EN PROCESO y ATENDIDA.
      - name: Verificar estados canónicos en la BD
        run: |
          PGPASSWORD=fc100711 psql -h localhost -U root -d appointment -tAc \
            "SELECT count(*) FROM appointment_statuses WHERE code IN \
             ('PENDIENTE','CONFIRMADA','EN ESPERA','EN PROCESO','ATENDIDA','CANCELADA','SUSPENDIDA','REAGENDADA')" \
            | grep -qx 8

      - name: Ejecutar pytest
        working-directory: backend
        run: python -m pytest -v

  # Etapa 3: typecheck y build del frontend.
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # noUnusedLocals y strict están activos: un import sin usar falla.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build