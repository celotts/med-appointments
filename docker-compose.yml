# ==========================================
# CONFIGURACIÓN CORREGIDA PARA PODMAN/DOCKER
# ==========================================

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: medical_pgvector
    environment:
      POSTGRES_DB: appointment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fc100711
    # Usamos 5433→5432, pero si está ocupado, podemos cambiar a 5434
    ports:
      - "5433:5432"  # Si da error, cambiar a "5434:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./script_BD:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag_network


  medical-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical_rag_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    working_dir: /app/app
    ports:
      - "5435:8000"  # Puerto del API (PostgreSQL ya usa 5433)
    volumes:
      - ./backend/app:/app/app
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - OLLAMA_BASE_URL=http://host.containers.internal:11434
      - OLLAMA_LLM_MODEL=llama3.2
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - DATABASE_URL=postgresql+asyncpg://postgres:fc100711@postgres-vector:5432/appointment  # Usa 5432 (puerto interno del container)
      - FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_SECONDS=${ACCESS_TOKEN_EXPIRE_SECONDS}
    depends_on:
      postgres-vector:
        condition: service_healthy
    networks:
      - rag_network

volumes:
  pgvector_data:

networks:
  rag_network:
    driver: bridge